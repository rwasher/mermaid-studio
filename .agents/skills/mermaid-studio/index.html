<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mermaid Studio</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 3rem; color: #172033; }
      main { max-width: 72rem; margin: auto; }
      .workspace { display: grid; grid-template-columns: minmax(16rem, 1fr) minmax(16rem, 1fr); gap: 2rem; align-items: start; }
      .pane h2 { font-size: 1rem; margin: 0 0 .5rem; }
      #source { box-sizing: border-box; width: 100%; min-height: 24rem; padding: .75rem; font: 0.95rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; }
      #copy-source { margin-top: .75rem; padding: .5rem .75rem; }
      #paste-source { margin-top: .75rem; padding: .5rem .75rem; }
      #import-source { margin-top: .75rem; padding: .5rem .75rem; }
      #export-svg { margin-top: .75rem; padding: .5rem .75rem; }
      #export-png { margin-top: .75rem; padding: .5rem .75rem; }
      #copy-svg { margin-top: .75rem; padding: .5rem .75rem; }
      #copy-png { margin-top: .75rem; padding: .5rem .75rem; }
      #diagram { min-height: 4rem; overflow: auto; }
      #status { color: #536078; }
      #status[data-state="error"] { color: #a12828; }
      @media (max-width: 46rem) { .workspace { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Mermaid Studio</h1>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Loading workspace…</p>
      <div class="workspace">
        <section class="pane" aria-labelledby="source-heading">
          <h2 id="source-heading">Mermaid source</h2>
          <textarea id="source" spellcheck="false" aria-label="Mermaid source"></textarea>
          <button id="copy-source" type="button">Copy Mermaid source</button>
          <button id="paste-source" type="button">Paste Mermaid source</button>
          <label for="import-source">Import Mermaid file</label>
          <input id="import-source" type="file" accept=".mmd" aria-label="Import Mermaid file">
        </section>
        <section class="pane" aria-labelledby="preview-heading">
          <h2 id="preview-heading">Preview</h2>
          <div id="diagram" aria-label="Rendered Mermaid diagram"></div>
          <button id="export-svg" type="button" disabled>Export SVG</button>
          <button id="export-png" type="button" disabled>Export PNG</button>
          <button id="copy-svg" type="button" disabled>Copy SVG</button>
          <button id="copy-png" type="button" disabled>Copy PNG</button>
        </section>
      </div>
    </main>
    <script type="module">
      import mermaid from '/node_modules/mermaid/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict' });
      let source = __MERMAID_SOURCE__;
      let revision = __MERMAID_REVISION__;
      let renderNumber = 0;
      let renderRequest = 0;
      let latestRender = { source: null, valid: false };
      let saveTimer;
      let saveInFlight = false;
      let queuedSave;
      let queuedSaveMessage;
      let pendingLocalEdit = false;
      const status = document.querySelector('#status');
      const editor = document.querySelector('#source');
      const diagram = document.querySelector('#diagram');
      const copySource = document.querySelector('#copy-source');
      const pasteSource = document.querySelector('#paste-source');
      const importSource = document.querySelector('#import-source');
      const exportSvg = document.querySelector('#export-svg');
      const exportPng = document.querySelector('#export-png');
      const copySvg = document.querySelector('#copy-svg');
      const copyPng = document.querySelector('#copy-png');
      editor.value = source;
      function setStatus(message, state = 'neutral') {
        status.textContent = message;
        status.dataset.state = state;
      }
      function setExportAvailability(available) {
        exportSvg.disabled = !available;
        exportPng.disabled = !available;
        copySvg.disabled = !available;
        copyPng.disabled = !available;
      }
      async function renderSource(nextSource, updateEditor = false) {
        source = nextSource;
        const request = ++renderRequest;
        setExportAvailability(false);
        if (updateEditor) editor.value = nextSource;
        if (!source.trim()) {
          if (request !== renderRequest) return;
          diagram.replaceChildren();
          latestRender = { source, valid: true };
          setStatus('Empty workspace. Add Mermaid source to the .mmd file to render a diagram.');
          return;
        }
        try {
          const { svg } = await mermaid.render(`mermaid-studio-workspace-${renderNumber += 1}`, nextSource);
          if (request !== renderRequest) return;
          diagram.innerHTML = svg;
          latestRender = { source: nextSource, valid: true };
          setExportAvailability(true);
          setStatus('Workspace rendered.', 'success');
        } catch (error) {
          if (request !== renderRequest) return;
          latestRender = { source: nextSource, valid: false };
          const detail = error?.message ?? error?.str ?? String(error);
          setStatus(`Unable to render workspace: ${detail}`, 'error');
        }
      }
      async function saveSource() {
        if (saveInFlight) return;
        saveInFlight = true;
        try {
          while (queuedSave !== undefined) {
            const pendingSource = queuedSave;
            const pendingMessage = queuedSaveMessage;
            queuedSave = undefined;
            queuedSaveMessage = undefined;
            const response = await fetch('/source', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ source: pendingSource, revision }),
            });
            const result = await response.json();
            if (response.status === 409) {
              setStatus('Save conflict: the workspace changed elsewhere. Your unsaved text is preserved.', 'error');
              return;
            }
            if (!response.ok) throw new Error(result.error ?? `Save failed (${response.status})`);
            revision = result.revision;
            if (source === pendingSource && queuedSave === undefined
              && latestRender.source === pendingSource && latestRender.valid) {
              setStatus(pendingMessage ?? 'Workspace saved and rendered.', 'success');
            }
            if (source === pendingSource && queuedSave === undefined) pendingLocalEdit = false;
          }
        } catch (error) {
          setStatus(error.message, 'error');
        } finally {
          saveInFlight = false;
        }
      }
      editor.addEventListener('input', () => {
        const nextSource = editor.value;
        pendingLocalEdit = true;
        queuedSave = nextSource;
        void renderSource(nextSource);
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => void saveSource(), 250);
      });
      copySource.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(editor.value);
          setStatus('Mermaid source copied to clipboard.', 'success');
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to copy Mermaid source: ${detail}`, 'error');
        }
      });
      pasteSource.addEventListener('click', async () => {
        try {
          if (!navigator.clipboard?.readText) throw new Error('Clipboard text access is unavailable.');
          const pastedSource = await navigator.clipboard.readText();
          if (!pastedSource.trim()) {
            setStatus('Unable to paste Mermaid source: Clipboard is empty.', 'error');
            return;
          }
          pendingLocalEdit = true;
          queuedSave = pastedSource;
          queuedSaveMessage = 'Mermaid source pasted and workspace saved.';
          await renderSource(pastedSource, true);
          clearTimeout(saveTimer);
          void saveSource();
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to paste Mermaid source: ${detail}`, 'error');
        }
      });
      importSource.addEventListener('change', async () => {
        const [file] = importSource.files ?? [];
        importSource.value = '';
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.mmd')) {
          setStatus('Unable to import Mermaid file: Choose a file ending in .mmd.', 'error');
          return;
        }
        try {
          const importedSource = await file.text();
          pendingLocalEdit = true;
          queuedSave = importedSource;
          queuedSaveMessage = 'Mermaid file imported and workspace saved.';
          await renderSource(importedSource, true);
          clearTimeout(saveTimer);
          void saveSource();
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to import Mermaid file: ${detail}`, 'error');
        }
      });
      function currentRenderedSvg(action) {
        const renderedSvg = diagram.querySelector('svg');
        if (renderedSvg && latestRender.valid && latestRender.source === source) return renderedSvg;
        setExportAvailability(false);
        setStatus(`Unable to ${action}: Render a valid Mermaid diagram first.`, 'error');
        return null;
      }
      function serializedSvg(renderedSvg) {
        return renderedSvg.outerHTML.includes('xmlns=')
          ? renderedSvg.outerHTML
          : renderedSvg.outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      function downloadBlob(blob, filename) {
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = filename;
        try {
          link.click();
        } finally {
          setTimeout(() => URL.revokeObjectURL(objectUrl), 0);
        }
      }
      exportSvg.addEventListener('click', () => {
        const renderedSvg = currentRenderedSvg('export SVG');
        if (!renderedSvg) return;
        try {
          downloadBlob(new Blob([serializedSvg(renderedSvg)], { type: 'image/svg+xml;charset=utf-8' }), 'mermaid-diagram.svg');
          setStatus('SVG diagram downloaded.', 'success');
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to export SVG: ${detail}`, 'error');
        }
      });
      function svgDimensions(svg) {
        const viewBox = svg.viewBox?.baseVal;
        const numericDimension = (value) => /^\s*\d+(?:\.\d+)?(?:px)?\s*$/.test(value ?? '') ? Number.parseFloat(value) : NaN;
        const width = numericDimension(svg.getAttribute('width'));
        const height = numericDimension(svg.getAttribute('height'));
        const bounds = svg.getBoundingClientRect();
        const resolvedWidth = Number.isFinite(width) && width > 0 ? width : viewBox?.width || bounds.width;
        const resolvedHeight = Number.isFinite(height) && height > 0 ? height : viewBox?.height || bounds.height;
        if (!Number.isFinite(resolvedWidth) || !Number.isFinite(resolvedHeight) || resolvedWidth <= 0 || resolvedHeight <= 0) {
          throw new Error('The rendered diagram has no usable dimensions.');
        }
        return { width: Math.max(1, Math.round(resolvedWidth)), height: Math.max(1, Math.round(resolvedHeight)) };
      }
      function canvasBlob(canvas) {
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('The browser could not encode the diagram as PNG.')), 'image/png');
        });
      }
      async function renderedPngBlob(renderedSvg) {
        const { width, height } = svgDimensions(renderedSvg);
        const image = new Image();
        const loaded = new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error('The browser could not load the rendered diagram for PNG export.'));
        });
        image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(serializedSvg(renderedSvg))}`;
        await loaded;
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('The browser does not support PNG export.');
        context.drawImage(image, 0, 0, width, height);
        return canvasBlob(canvas);
      }
      async function copyPngOrDownload() {
        const renderedSvg = currentRenderedSvg('copy PNG');
        if (!renderedSvg) return;
        let pngBlob;
        try {
          pngBlob = await renderedPngBlob(renderedSvg);
          if (!navigator.clipboard?.write || typeof ClipboardItem !== 'function') {
            downloadBlob(pngBlob, 'mermaid-diagram.png');
            setStatus('PNG clipboard is unavailable; PNG diagram downloaded instead.', 'success');
            return;
          }
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
          setStatus('PNG diagram copied to clipboard.', 'success');
        } catch (error) {
          const detail = error?.message ?? String(error);
          if (pngBlob) {
            try {
              downloadBlob(pngBlob, 'mermaid-diagram.png');
              setStatus(`PNG clipboard unavailable; PNG diagram downloaded instead (${detail}).`, 'success');
              return;
            } catch (fallbackError) {
              setStatus(`Unable to copy or download PNG: ${fallbackError?.message ?? detail}`, 'error');
              return;
            }
          }
          setStatus(`Unable to export PNG: ${detail}`, 'error');
        }
      }
      exportPng.addEventListener('click', async () => {
        const renderedSvg = currentRenderedSvg('export PNG');
        if (!renderedSvg) return;
        try {
          downloadBlob(await renderedPngBlob(renderedSvg), 'mermaid-diagram.png');
          setStatus('PNG diagram downloaded.', 'success');
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to export PNG: ${detail}`, 'error');
        }
      });
      copySvg.addEventListener('click', async () => {
        const renderedSvg = currentRenderedSvg('copy SVG');
        if (!renderedSvg) return;
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard text access is unavailable.');
          await navigator.clipboard.writeText(serializedSvg(renderedSvg));
          setStatus('SVG copied to clipboard.', 'success');
        } catch (error) {
          const detail = error?.message ?? String(error);
          setStatus(`Unable to copy SVG: ${detail}`, 'error');
        }
      });
      copyPng.addEventListener('click', () => void copyPngOrDownload());
      await renderSource(source);
      setInterval(async () => {
        try {
          const response = await fetch('/source', { cache: 'no-store' });
          if (!response.ok) return;
          const { source: nextSource, revision: nextRevision } = await response.json();
          if (nextSource !== source && !pendingLocalEdit && !saveInFlight && queuedSave === undefined) {
            revision = nextRevision;
            await renderSource(nextSource, true);
          } else if (nextSource === source) {
            revision = nextRevision;
          }
        } catch {
          // A transient poll failure should not disturb the current preview.
        }
      }, 250);
    </script>
  </body>
</html>
